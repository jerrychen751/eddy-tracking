# Gulf Stream pigment experiment methods.
# 1. Eddy boundaries use PET's speed contour, where the mean speed around the contour is greatest.
# 2. time_of_year_cos and time_of_year_sin represent the annual cycle as cos/sin of 2*pi*days/365, with days counted from January 1.
# 3. The ocean mask excludes the Great Lakes box, lon [-81,-75] and lat [40,44]. It keeps cells at least 8 grid cells from invalid data.
# Apply the ocean mask to the downloaded SWOT data before eddy identification and all derived outputs.
# 4. Rrs comes from the PACE L2 swaths, not the 8-day L3 composite. download_pace_l2 drops the pixels with an excluded flag and averages the rest of each day onto the 4 km L3 grid, and collocate_pace then matches each eddy day to the grid of the same day.
# The eddies are those of gulf_stream_20240305_20260531 after its 2026-10-13 SSH extension: copy its silver/eddy_track and silver/gulf_stream into this experiment. It reads the daily files of gulf_stream_20240305_20260531_pace_l2 and differs from it in the interior coverage gate, 0.5 instead of 0.8, and in keeping only the target eddies. Run collocate_pace run_sdp build_gold_table.

base:

  dataset: "gulf_stream_20240305_20260531"

  region:
    lon_range: [-81, -56]
    lat_range: [29, 44]

  time:
    # SWOT SSH date range for eddy detection/tracking. Starts ~11 months before the PACE
    # date range so eddy births are observed and age_frac is not truncated at the edge.
    eddy_date_range: ["2023-03-28", "2026-10-10"]
    # PACE swath date range: earliest PACE composite through the last tracked day.
    rrs_date_range: ["2024-03-05", "2025-12-31"]

  # Paths resolve to data/<dataset>/<dir>/
  data:
    root: "data"
    swot_dir: "swot_l4_open_ocean"
    pace_dir: "pace_l2_day"
    sss_dir: "sss"
    sst_dir: "sst"
    sss_raw_tmp: "sss_raw_tmp"
    plankton_dir: "plankton"

  download:
    swot:
      # AVISO experimental DUACS-MIOST L4 including SWOT, v3.0: gapless 2023-03-28 to
      # 2025-12-31 (a flat dir, no science/calval split, unlike v2_0_1).
      ftp_dir: "swot_products/l4_karin_nadir/v3_0/miost"
      max_workers: 8
      filter_open_ocean: true
      exclude_box:
        lon_range: [-81, -75]
        lat_range: [40, 44]

    pace_l2:
      collection_id: "C4124887023-OB_CLOUD"
      version: "V3_2"
      max_workers: 2
      # The flags NASA masks when it bins L2 into the L3 ocean color products.
      excluded_flags: [ATMFAIL, LAND, HILT, HISATZEN, STRAYLIGHT, CLDICE, COCCOLITH, LOWLW, CHLWARN, CHLFAIL, NAVWARN, MAXAERITER, ATMWARN, HISOLZEN, NAVFAIL, FILTER, HIGLINT]

    sst:
      collection_id: "C1615905770-OB_DAAC"

    sss:
      collection_id: "C2208422957-POCLOUD"
      num_requests_workers: 4
      download_chunk_size_mb: 16

    cmems:
      dataset_id: "cmems_obs-oc_glo_bgc-plankton_my_l3-multi-4km_P1D"
      dataset_version: "202603"

eddy_id:
  max_workers: 6

  bessel_high_filter_wavelength: 500  # high-pass cutoff (km)

  step: 0.004 # SSH contour step (m)
  shape_error: 55 # max % deviation from circle
  min_amplitude: 0.008

eddy_track:
  # Max consecutive missed days before breaking a track
  virtual: 5

  # Max km per elapsed day a center may move from its last detection, beyond the two speed radii
  max_speed_km_per_day: 10

  # Discard tracks shorter than this (days)
  min_track_days: 30

collocate_plankton:
  min_coverage: 0.5
  min_pixels: 10

collocate_pace:
  min_coverage: 0.5
  max_radius: 2
  temporal_resolution: "DAY"

  # Keep only eddy-days within the PACE and SSH overlap. Eddies are tracked over the earlier
  # eddy_date_range, but collocation should not retain eddy-days outside rrs_date_range.
  date_range: ["2024-03-05", "2025-12-31"]

  # The target eddies of either polarity under the rule before 2026-10-13 (crossers plus near-axis births), a superset of the crossing-only targets; an id shared by a cyclone and an anticyclone keeps both
  track_ids: [1, 13, 14, 19, 34, 35, 46, 54, 74, 80, 89, 103, 112, 113, 126, 127, 133, 138, 168, 181, 184, 193, 206, 211, 212, 218, 220, 234, 236, 237, 241, 242, 248, 252, 258, 259, 266, 270, 275, 278, 282, 287, 304, 311, 329, 336, 337, 338, 348, 353, 355, 360, 362, 365, 369, 380, 384, 392, 400, 404, 408, 412, 415, 419, 457, 463, 464, 468, 476, 479, 488, 508, 522, 543, 545]

run_sdp:
  max_workers: 4

gulf_stream:
  adt_level_range: [0.10, 0.60]
