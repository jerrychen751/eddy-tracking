# Gulf Stream pigment experiment methods.
# 1. Eddy boundaries use PET's speed contour, where the mean speed around the contour is greatest.
# 2. time_of_year_cos and time_of_year_sin represent the annual cycle as cos/sin of 2*pi*days/365, with days counted from January 1.
# 3. The ocean mask excludes the Great Lakes box, lon [-81,-75] and lat [40,44]. It keeps cells at least 8 grid cells from invalid data.
# Apply the ocean mask to the downloaded SWOT data before eddy identification and all derived outputs.

base:

  dataset: "gulf_stream_20240305_20260531"

  region:
    lon_range: [-81, -56]
    lat_range: [29, 44]

  time:
    # SWOT SSH window for eddy detection/tracking. Starts ~11 months before the PACE
    # window so eddy births are observed and age_frac is not truncated at the edge.
    eddy_date_range: ["2023-03-28", "2025-12-31"]
    # PACE Rrs + ancillary window: earliest PACE composite through May 2026.
    rrs_date_range: ["2024-03-05", "2026-05-31"]

  # Paths resolve to data/<dataset>/<dir>/
  data:
    root: "data"
    swot_dir: "swot_l4_open_ocean"
    pace_dir: "pace_l3_8d"
    pace_bgc_dir: "pace_l3_8d_bgc"
    sss_dir: "sss"
    sst_dir: "sst"
    sss_raw_tmp: "sss_raw_tmp"
    plankton_dir: "plankton"

  download:
    swot:
      # AVISO experimental DUACS-MIOST L4 including SWOT, v3.0: gapless 2023-03-28 to
      # 2025-12-31 (a flat dir, no science/calval split, unlike v2_0_1).
      ftp_dir: "swot_products/l4_karin_nadir/v3_0/miost"
      max_workers: 8
      filter_open_ocean: true

    pace:
      temporal_resolution: "8D"
      version: "V3_2"
      collection_ids:
        AOP: "C4184125822-OB_CLOUD"
        BGC: "C4184125847-OB_CLOUD"

    sst:
      collection_id: "C1615905770-OB_DAAC"

    sss:
      collection_id: "C2208422957-POCLOUD"
      num_requests_workers: 4
      download_chunk_size_mb: 16

    cmems:
      dataset_id: "cmems_obs-oc_glo_bgc-plankton_my_l3-multi-4km_P1D"
      dataset_version: "202603"

eddy_id:
  max_workers: 6

  bessel_high_filter_wavelength: 500  # high-pass cutoff (km)

  step: 0.004 # SSH contour step (m)
  shape_error: 55 # max % deviation from circle

eddy_track:
  # Max consecutive missed days before breaking a track
  virtual: 5

  # Discard tracks shorter than this (days)
  min_track_days: 30

  # Post-tracking position smoothing (half-window sizes)
  position_filter:
    median_half_window: 1 # removes single-day outlier jumps
    loess_half_window: 5 # smooths trajectory

collocate_chlorophyll:
  min_coverage: 0.5
  min_pixels: 10

collocate_plankton:
  min_coverage: 0.5
  min_pixels: 10

collocate_pace:
  min_coverage: 0.8
  temporal_resolution: "8D"

  # Keep only eddy-days within the PACE and SSH overlap. Eddies are tracked over the earlier
  # eddy_date_range, but collocation should not retain eddy-days outside rrs_date_range.
  date_range: ["2024-03-05", "2025-12-31"]

  # Restrict to specific track IDs (omit to process all)
  # track_ids: [5, 12, 20]

run_sdp:
  max_workers: 4
