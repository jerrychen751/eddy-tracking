[project]
name = "eddy-tracking"
version = "0.1.0"
description = "Mesoscale eddy tracking in the Gulf Stream with PACE OCI pigment and PFT collocation."
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",            # <2 keeps numba 0.63 compatible
    "scipy==1.15.3",
    "pandas==2.3.3",
    "xarray==2025.6.1",
    "netcdf4==1.7.4",
    "cftime==1.6.5",
    "zarr==2.18.3",             # py-eddy-tracker requires <3.0
    "pyarrow==22.0.0",
    "dask==2026.1.1",
    "bottleneck==1.4.2",
    "cf-xarray==0.10.6",
    "matplotlib==3.7.5",        # py-eddy-tracker requires <3.8
    "cartopy==0.25.0",
    "pyproj==3.7.1",
    "shapely==2.0.7",
    "geopandas==1.1.2",
    "earthaccess==0.14.0",
    "harmony-py==1.3.3",
    "s3fs==2026.2.0",
    "requests==2.32.5",
    "tqdm==4.67.3",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.3",
    "scikit-learn",             # used by clustering/RF analysis; was missing from the conda env
    "numba==0.63.1",
    "opencv-python==4.11.0.86",
    "pint==0.24.4",
    "polygon3==3.0.9.1",
    "pyeddytracker",            # py-eddy-tracker from PyPI; eddy_id.py bypasses PET CLI filename templating
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
